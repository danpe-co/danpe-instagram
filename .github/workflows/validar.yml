name: Validar fila

on:
  pull_request:
    paths: ["queue/**"]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python publisher/publish.py --check
